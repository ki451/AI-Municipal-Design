<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Architect Generator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f5; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a365d; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        button { background: #2b6cb0; color: white; border: none; padding: 12px; border-radius: 5px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        button:hover { background: #2c5282; }
        .result { margin-top: 25px; padding-top: 20px; border-top: 2px solid #eee; text-align: center; }
        .btn-download { display: block; background: #38a169; color: white; text-decoration: none; padding: 12px; border-radius: 5px; margin-top: 10px; font-weight: bold; }
        img { width: 100%; border-radius: 8px; margin-top: 15px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🏛️ AI Architect</h2>
        <p style="text-align: center; color: #666;">Generate designs from scratch</p>
        
        <form method="POST">
            <div class="form-group">
                <label>Client Name</label>
                <input type="text" name="client_name" required>
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" required>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Site Length (ft)</label>
                    <input type="number" name="site_length" value="30" required>
                </div>
                <div class="form-group">
                    <label>Site Width (ft)</label>
                    <input type="number" name="site_width" value="40" required>
                </div>
            </div>
            <div class="form-group">
                <label>Requirements (e.g., 2 Bedrooms, 1 Kitchen, 1 Living)</label>
                <input type="text" name="requirements" value="2 Bedrooms, 1 Kitchen, 1 Living, 1 Bath" required>
            </div>
            
            <button type="submit">Generate Design</button>
        </form>

        {% if render_url %}
        <div class="result">
            <h3>✅ Design Generated!</h3>
            <img src="{{ render_url }}" alt="3D Render">
            <a href="{{ pdf_url }}" class="btn-download">📄 Download PDF</a>
            <a href="{{ dxf_url }}" class="btn-download">📐 Download AutoCAD DXF</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
