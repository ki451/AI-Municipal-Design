<!DOCTYPE html>
<html>
<head>
    <title>3D Floor Plan</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .floor-container { background: white; padding: 20px; margin-bottom: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .room { stroke: #333; stroke-width: 2; }
        .door { stroke: #8e44ad; stroke-width: 3; fill: none; }
        .window { stroke: #3498db; stroke-width: 4; }
        .label { font-size: 14px; font-weight: bold; fill: #111; text-anchor: middle; dominant-baseline: middle; }
        .dim { font-size: 11px; fill: #555; text-anchor: middle; dominant-baseline: middle; }
        .living { fill: #a8e6cf; } .bedroom { fill: #dcedc1; } .kitchen { fill: #ffd3b6; }
        .bathroom { fill: #ffaaa5; } .corridor { fill: #e0e0e0; } .staircase { fill: #dfe6e9; }
        .puja { fill: #ffeaa7; } .balcony { fill: #81ecec; } .default { fill: #f8f9fa; }
        #view3d-container { width: 100%; height: 600px; background: #222; display: none; margin-top: 20px; border-radius: 8px; overflow: hidden; }
        .btn { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-bottom: 20px; }
        .btn:hover { background: #2980b9; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <h1>Design: MUNICIPALITY_APPROVED_Modern</h1>
    <button class="btn" onclick="toggle3D()">🔄 Toggle 2D / 3D View</button>

'room puja' /><line x1='260.5' y1='322' x2='280.5' y2='322' stroke='#fff' stroke-width='4' /><path d='M 260.5 322 A 20 20 0 0 1 280.5 302' class='door' /><line x1='255.5' y1='234' x2='285.5' y2='234' class='window' /><text x='270.5' y='270' class='label'>PUJA</text><text x='270.5' y='286' class='dim'>2.32x2.5m</text><rect x='315' y='234' width='122' height='175' class='room default' /><line x1='366' y1='409' x2='386' y2='409' stroke='#fff' stroke-width='4' /><path d='M 366 409 A 20 20 0 0 1 386 389' class='door' /><line x1='361' y1='234' x2='391' y2='234' class='window' /><text x='376' y='313.5' class='label'>PARKING</text><text x='376' y='329.5' class='dim'>3.48x5m</text><rect x='20' y='20' width='420' height='1050' fill='none' stroke='#e74c3c' stroke-width='3' stroke-dasharray='5,5' /></svg></div><div class='floor-container'><h2>Floor 2 - (3 rooms)</h2><svg width='460' height='1090' style='border: 2px solid #bdc3c7; background: #fff;'><rect x='20' y='20' width='164' height='158' class='room bedroom' /><line x1='92' y1='178' x2='112' y2='178' stroke='#fff' stroke-width='4' /><path d='M 92 178 A 20 20 0 0 1 112 158' class='door' /><line x1='87' y1='20' x2='117' y2='20' class='window' /><text x='102' y='91' class='label'>BEDROOM</text><text x='102' y='107' class='dim'>4.68x4.5m</text><rect x='187' y='20' width='164' height='158' class='room bedroom' /><line x1='259' y1='178' x2='279' y2='178' stroke='#fff' stroke-width='4' /><path d='M 259 178 A 20 20 0 0 1 279 158' class='door' /><line x1='254' y1='20' x2='284' y2='20' class='window' /><text x='269' y='91' class='label'>BEDROOM</text><text x='269' y='107' class='dim'>4.68x4.5m</text><rect x='355' y='20' width='82' height='88' class='room bathroom' /><line x1='386' y1='108' x2='406' y2='108' stroke='#fff' stroke-width='4' /><path d='M 386 108 A 20 20 0 0 1 406 88' class='door' /><line x1='381' y1='20' x2='411' y2='20' class='window' /><text x='396' y='56' class='label'>BATHROOM</text><text x='396' y='72' class='dim'>2.34x2.5m</text><rect x='20' y='20' width='420' height='1050' fill='none' stroke='#e74c3c' stroke-width='3' stroke-dasharray='5,5' /></svg></div><div class='floor-container'><h2>Floor 3 - (3 rooms)</h2><svg width='460' height='1090' style='border: 2px solid #bdc3c7; background: #fff;'><rect x='20' y='20' width='218' height='158' class='room bedroom' /><line x1='119' y1='178' x2='139' y2='178' stroke='#fff' stroke-width='4' /><path d='M 119 178 A 20 20 0 0 1 139 158' class='door' /><line x1='114' y1='20' x2='144' y2='20' class='window' /><text x='129' y='91' class='label'>BEDROOM</text><text x='129' y='107' class='dim'>6.24x4.5m</text><rect x='242' y='20' width='109' height='88' class='room bathroom' /><line x1='286.5' y1='108' x2='306.5' y2='108' stroke='#fff' stroke-width='4' /><path d='M 286.5 108 A 20 20 0 0 1 306.5 88' class='door' /><line x1='281.5' y1='20' x2='311.5' y2='20' class='window' /><text x='296.5' y='56' class='label'>BATHROOM</text><text x='296.5' y='72' class='dim'>3.12x2.5m</text><rect x='355' y='20' width='82' height='105' class='room balcony' /><line x1='386' y1='125' x2='406' y2='125' stroke='#fff' stroke-width='4' /><path d='M 386 125 A 20 20 0 0 1 406 105' class='door' /><line x1='381' y1='20' x2='411' y2='20' class='window' /><text x='396' y='64.5' class='label'>BALCONY</text><text x='396' y='80.5' class='dim'>2.34x3m</text><rect x='20' y='20' width='420' height='1050' fill='none' stroke='#e74c3c' stroke-width='3' stroke-dasharray='5,5' /></svg></div></div><div id='view3d-container'></div>    <script>
        let is3D = false;
        const roomsData = [{"id":"r13","normalizedType":"corridor","label":"Main Corridor","lengthM":4,"areaM2":6,"floor":1,"x":0,"y":0,"x2":1.95,"y2":4,"widthM":1.95},{"id":"r5","normalizedType":"staircase","label":"Staircase","lengthM":4.16,"areaM2":10.4,"floor":1,"x":2.05,"y":0,"x2":5.3,"y2":4.16,"widthM":3.25},{"id":"r1","normalizedType":"living","label":"Living Room","lengthM":6,"areaM2":30,"floor":1,"x":5.4,"y":0,"x2":11.9,"y2":6,"widthM":6.5},{"id":"r2","normalizedType":"kitchen","label":"Kitchen","lengthM":4,"areaM2":12,"floor":1,"x":0,"y":6.1,"x2":3.48,"y2":10.1,"widthM":3.48},{"id":"r6","normalizedType":"bathroom","label":"Common Bath","lengthM":2.5,"areaM2":5,"floor":1,"x":3.58,"y":6.1,"x2":5.9,"y2":8.6,"widthM":2.3200000000000003},{"id":"r3","normalizedType":"puja","label":"Puja Room","lengthM":2.5,"areaM2":5,"floor":1,"x":6,"y":6.1,"x2":8.32,"y2":8.6,"widthM":2.3200000000000003},{"id":"r4","normalizedType":"parking","label":"Car Parking","lengthM":5,"areaM2":15,"floor":1,"x":8.42,"y":6.1,"x2":11.9,"y2":11.1,"widthM":3.48}];
        
        function toggle3D() {
            is3D = !is3D;
            document.getElementById('view2d').style.display = is3D ? 'none' : 'block';
            document.getElementById('view3d-container').style.display = is3D ? 'block' : 'none';
            if (is3D && !window.sceneInitialized) { init3D(); window.sceneInitialized = true; }
        }

        function init3D() {
            const container = document.getElementById('view3d-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(15, 20, 30);
            camera.lookAt(6, 0, 15);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const wallHeight = 3.0;
            const colors = {
                'living': 0xa8e6cf, 'bedroom': 0xdcedc1, 'kitchen': 0xffd3b6,
                'bathroom': 0xffaaa5, 'default': 0xf8f9fa
            };

            roomsData.forEach(room => {
                const w = room.widthM;
                const l = room.lengthM;
                const x = room.x + w/2;
                const z = room.y + l/2;
                
                const geo = new THREE.BoxGeometry(w, wallHeight, l);
                const color = colors[room.normalizedType] || colors['default'];
                const mat = new THREE.MeshPhongMaterial({ color: color, transparent: true, opacity: 0.8 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, wallHeight/2, z);
                scene.add(mesh);
                
                const edges = new THREE.EdgesGeometry(geo);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x333333 }));
                line.position.copy(mesh.position);
                scene.add(line);
            });

            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
