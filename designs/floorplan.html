<!DOCTYPE html><html><head><title>Floor Plan</title>
<style>
body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 20px; }
.floor-container { background: white; padding: 20px; margin-bottom: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
.room { stroke: #333; stroke-width: 2; }
.label { font-size: 14px; font-weight: bold; fill: #111; text-anchor: middle; dominant-baseline: middle; }
.dim { font-size: 11px; fill: #555; text-anchor: middle; dominant-baseline: middle; }
.living { fill: #a8e6cf; } .bedroom { fill: #dcedc1; } .kitchen { fill: #ffd3b6; }
.bathroom { fill: #ffaaa5; } .corridor { fill: #e0e0e0; } .staircase { fill: #dfe6e9; }
.puja { fill: #ffeaa7; } .balcony { fill: #81ecec; } .default { fill: #f8f9fa; }
</style></head><body><h1>Design: REAL_HOUSE</h1><div class='floor-container'><h2>Floor 1 - (3 rooms)</h2><svg width='460' height='1090' style='border: 2px solid #bdc3c7; background: #fff;'><rect x='20' y='20' width='205' height='210' class='room living' /><text x='122.5' y='117' class='label'>LIVING</text><text x='122.5' y='133' class='dim'>5.85x6m</text><rect x='228' y='20' width='123' height='140' class='room kitchen' /><text x='289.5' y='82' class='label'>KITCHEN</text><text x='289.5' y='98' class='dim'>3.51x4m</text><rect x='355' y='20' width='82' height='88' class='room bathroom' /><text x='396' y='56' class='label'>BATHROOM</text><text x='396' y='72' class='dim'>2.34x2.5m</text><rect x='20' y='20' width='420' height='1050' fill='none' stroke='#e74c3c' stroke-width='3' stroke-dasharray='5,5' /></svg></div><div class='floor-container'><h2>Floor 2 - (1 rooms)</h2><svg width='460' height='1090' style='border: 2px solid #bdc3c7; background: #fff;'><rect x='20' y='20' width='416' height='158' class='room bedroom' /><text x='228' y='91' class='label'>BEDROOM</text><text x='228' y='107' class='dim'>11.9x4.5m</text><rect x='20' y='20' width='420' height='1050' fill='none' stroke='#e74c3c' stroke-width='3' stroke-dasharray='5,5' /></svg></div></body></html>
