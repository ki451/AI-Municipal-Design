<!DOCTYPE html>
<html>
<head>
    <title>3D Floor Plan</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .floor-container { background: white; padding: 20px; margin-bottom: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .room { stroke: #333; stroke-width: 2; }
        .door { stroke: #8e44ad; stroke-width: 3; fill: none; }
        .window { stroke: #3498db; stroke-width: 4; }
        .label { font-size: 14px; font-weight: bold; fill: #111; text-anchor: middle; dominant-baseline: middle; }
        .dim { font-size: 11px; fill: #555; text-anchor: middle; dominant-baseline: middle; }
        .living { fill: #a8e6cf; } .bedroom { fill: #dcedc1; } .kitchen { fill: #ffd3b6; }
        .bathroom { fill: #ffaaa5; } .corridor { fill: #e0e0e0; } .staircase { fill: #dfe6e9; }
        .puja { fill: #ffeaa7; } .balcony { fill: #81ecec; } .default { fill: #f8f9fa; }
        #view3d-container { width: 100%; height: 600px; background: #222; display: none; margin-top: 20px; border-radius: 8px; overflow: hidden; }
        .btn { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-bottom: 20px; }
        .btn:hover { background: #2980b9; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <h1>Design: REAL_HOUSE_ZONED</h1>
    <button class="btn" onclick="toggle3D()">🔄 Toggle 2D / 3D View</button>
    <div id="view2d"><div class='floor-container'><h2>Floor 1 - (7 rooms)</h2><svg width='460' height='1090' style='border: 2px solid #bdc3c7; background: #fff;'><rect x='20' y='20' width='88' height='146' class='room staircase' /><line x1='54' y1='166' x2='74' y2='166' stroke='#fff' stroke-width='4' /><path d='M 54 166 A 20 20 0 0 1 74 146' class='door' /><line x1='49' y1='20' x2='79' y2='20' class='window' /><text x='64' y='85' class='label'>STAIRCASE</text><text x='64' y='101' class='dim'>2.5x4.16m</text><rect x='108' y='20' width='175' height='210' class='room living' /><line x1='185.5' y1='230' x2='205.5' y2='230' stroke='#fff' stroke-width='4' /><path d='M 185.5 230 A 20 20 0 0 1 205.5 210' class='door' /><line x1='180.5' y1='20' x2='210.5' y2='20' class='window' /><text x='195.5' y='117' class='label'>LIVING</text><text x='195.5' y='133' class='dim'>5x6m</text><rect x='282' y='20' width='105' height='140' class='room kitchen' /><line x1='324.5' y1='160' x2='344.5' y2='160' stroke='#fff' stroke-width='4' /><path d='M 324.5 160 A 20 20 0 0 1 344.5 140' class='door' /><line x1='319.5' y1='20' x2='349.5' y2='20' class='window' /><text x='334.5' y='82' class='label'>KITCHEN</text><text x='334.5' y='98' class='dim'>3x4m</text><rect x='20' y='230' width='70' height='88' class='room puja' /><line x1='45' y1='318' x2='65' y2='318' stroke='#fff' stroke-width='4' /><path d='M 45 318 A 20 20 0 0 1 65 298' class='door' /><line x1='40' y1='230' x2='70' y2='230' class='window' /><text x='55' y='266' class='label'>PUJA</text><text x='55' y='282' class='dim'>2x2.5m</text><rect x='90' y='230' width='105' height='175' class='room default' /><line x1='132.5' y1='405' x2='152.5' y2='405' stroke='#fff' stroke-width='4' /><path d='M 132.5 405 A 20 20 0 0 1 152.5 385' class='door' /><line x1='127.5' y1='230' x2='157.5' y2='230' class='window' /><text x='142.5' y='309.5' class='label'>PARKING</text><text x='142.5' y='325.5' class='dim'>3x5m</text><rect x='195' y='230' width='70' height='88' class='room bathroom' /><line x1='220' y1='318' x2='240' y2='318' stroke='#fff' stroke-width='4' /><path d='M 220 318 A 20 20 0 0 1 240 298' class='door' /><line x1='215' y1='230' x2='245' y2='230' class='window' /><text x='230' y='266' class='label'>BATHROOM</text><text x='230' y='282' class='dim'>2x2.5m</text><rect x='265' y='230' width='52' height='140' class='room corridor' /><line x1='281' y1='370' x2='301' y2='370' stroke='#fff' stroke-width='4' /><path d='M 281 370 A 20 20 0 0 1 301 350' class='door' /><line x1='276' y1='230' x2='306' y2='230' class='window' /><text x='291' y='292' class='label'>CORRIDOR</text><text x='291' y='308' class='dim'>1.5x4m</text><rect x='20' y='20' width='420' height='1050' fill='none' stroke='#e74c3c' stroke-width='3' stroke-dasharray='5,5' /></svg></div><div class='floor-container'><h2>Floor 2 - (3 rooms)</h2><svg width='460' height='1090' style='border: 2px solid #bdc3c7; background: #fff;'><rect x='20' y='20' width='140' height='158' class='room bedroom' /><line x1='80' y1='178' x2='100' y2='178' stroke='#fff' stroke-width='4' /><path d='M 80 178 A 20 20 0 0 1 100 158' class='door' /><line x1='75' y1='20' x2='105' y2='20' class='window' /><text x='90' y='91' class='label'>BEDROOM</text><text x='90' y='107' class='dim'>4x4.5m</text><rect x='160' y='20' width='70' height='88' class='room bathroom' /><line x1='185' y1='108' x2='205' y2='108' stroke='#fff' stroke-width='4' /><path d='M 185 108 A 20 20 0 0 1 205 88' class='door' /><line x1='180' y1='20' x2='210' y2='20' class='window' /><text x='195' y='56' class='label'>BATHROOM</text><text x='195' y='72' class='dim'>2x2.5m</text><rect x='230' y='20' width='140' height='158' class='room bedroom' /><line x1='290' y1='178' x2='310' y2='178' stroke='#fff' stroke-width='4' /><path d='M 290 178 A 20 20 0 0 1 310 158' class='door' /><line x1='285' y1='20' x2='315' y2='20' class='window' /><text x='300' y='91' class='label'>BEDROOM</text><text x='300' y='107' class='dim'>4x4.5m</text><rect x='20' y='20' width='420' height='1050' fill='none' stroke='#e74c3c' stroke-width='3' stroke-dasharray='5,5' /></svg></div><div class='floor-container'><h2>Floor 3 - (3 rooms)</h2><svg width='460' height='1090' style='border: 2px solid #bdc3c7; background: #fff;'><rect x='20' y='20' width='70' height='88' class='room bathroom' /><line x1='45' y1='108' x2='65' y2='108' stroke='#fff' stroke-width='4' /><path d='M 45 108 A 20 20 0 0 1 65 88' class='door' /><line x1='40' y1='20' x2='70' y2='20' class='window' /><text x='55' y='56' class='label'>BATHROOM</text><text x='55' y='72' class='dim'>2x2.5m</text><rect x='90' y='20' width='140' height='158' class='room bedroom' /><line x1='150' y1='178' x2='170' y2='178' stroke='#fff' stroke-width='4' /><path d='M 150 178 A 20 20 0 0 1 170 158' class='door' /><line x1='145' y1='20' x2='175' y2='20' class='window' /><text x='160' y='91' class='label'>BEDROOM</text><text x='160' y='107' class='dim'>4x4.5m</text><rect x='230' y='20' width='52' height='105' class='room balcony' /><line x1='246' y1='125' x2='266' y2='125' stroke='#fff' stroke-width='4' /><path d='M 246 125 A 20 20 0 0 1 266 105' class='door' /><line x1='241' y1='20' x2='271' y2='20' class='window' /><text x='256' y='64.5' class='label'>BALCONY</text><text x='256' y='80.5' class='dim'>1.5x3m</text><rect x='20' y='20' width='420' height='1050' fill='none' stroke='#e74c3c' stroke-width='3' stroke-dasharray='5,5' /></svg></div></div><div id='view3d-container'></div>    <script>
        let is3D = false;
        const roomsData = [{"id":"r5","normalizedType":"staircase","label":"Staircase","widthM":2.5,"lengthM":4.16,"areaM2":10.4,"floor":1,"x":0,"y":0,"x2":2.5,"y2":4.16},{"id":"r1","normalizedType":"living","label":"Living Room","widthM":5,"lengthM":6,"areaM2":30,"floor":1,"x":2.5,"y":0,"x2":7.5,"y2":6},{"id":"r2","normalizedType":"kitchen","label":"Kitchen","widthM":3,"lengthM":4,"areaM2":12,"floor":1,"x":7.5,"y":0,"x2":10.5,"y2":4},{"id":"r3","normalizedType":"puja","label":"Puja Room","widthM":2,"lengthM":2.5,"areaM2":5,"floor":1,"x":0,"y":6,"x2":2,"y2":8.5},{"id":"r4","normalizedType":"parking","label":"Car Parking","widthM":3,"lengthM":5,"areaM2":15,"floor":1,"x":2,"y":6,"x2":5,"y2":11},{"id":"r6","normalizedType":"bathroom","label":"Common Bath","widthM":2,"lengthM":2.5,"areaM2":5,"floor":1,"x":5,"y":6,"x2":7,"y2":8.5},{"id":"r13","normalizedType":"corridor","label":"Main Corridor","widthM":1.5,"lengthM":4,"areaM2":6,"floor":1,"x":7,"y":6,"x2":8.5,"y2":10}];
        
        function toggle3D() {
            is3D = !is3D;
            document.getElementById('view2d').style.display = is3D ? 'none' : 'block';
            document.getElementById('view3d-container').style.display = is3D ? 'block' : 'none';
            if (is3D && !window.sceneInitialized) { init3D(); window.sceneInitialized = true; }
        }

        function init3D() {
            const container = document.getElementById('view3d-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(15, 20, 30);
            camera.lookAt(6, 0, 15);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const wallHeight = 3.0;
            const colors = {
                'living': 0xa8e6cf, 'bedroom': 0xdcedc1, 'kitchen': 0xffd3b6,
                'bathroom': 0xffaaa5, 'default': 0xf8f9fa
            };

            roomsData.forEach(room => {
                const w = room.widthM;
                const l = room.lengthM;
                const x = room.x + w/2;
                const z = room.y + l/2;
                
                const geo = new THREE.BoxGeometry(w, wallHeight, l);
                const color = colors[room.normalizedType] || colors['default'];
                const mat = new THREE.MeshPhongMaterial({ color: color, transparent: true, opacity: 0.8 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, wallHeight/2, z);
                scene.add(mesh);
                
                const edges = new THREE.EdgesGeometry(geo);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x333333 }));
                line.position.copy(mesh.position);
                scene.add(line);
            });

            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
