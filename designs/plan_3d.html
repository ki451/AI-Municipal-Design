<!DOCTYPE html>
<html>
<head>
    <title>3D Floor Plan</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .floor-container { background: white; padding: 20px; margin-bottom: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .room { stroke: #333; stroke-width: 2; }
        .door { stroke: #8e44ad; stroke-width: 3; fill: none; }
        .window { stroke: #3498db; stroke-width: 4; }
        .label { font-size: 14px; font-weight: bold; fill: #111; text-anchor: middle; dominant-baseline: middle; }
        .dim { font-size: 11px; fill: #555; text-anchor: middle; dominant-baseline: middle; }
        .living { fill: #a8e6cf; } .bedroom { fill: #dcedc1; } .kitchen { fill: #ffd3b6; }
        .bathroom { fill: #ffaaa5; } .corridor { fill: #e0e0e0; } .staircase { fill: #dfe6e9; }
        .puja { fill: #ffeaa7; } .balcony { fill: #81ecec; } .default { fill: #f8f9fa; }
        #view3d-container { width: 100%; height: 600px; background: #222; display: none; margin-top: 20px; border-radius: 8px; overflow: hidden; }
        .btn { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-bottom: 20px; }
        .btn:hover { background: #2980b9; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <h1>Design: REAL_HOUSE</h1>
    <button class="btn" onclick="toggle3D()">🔄 Toggle 2D / 3D View</button>
    <div id="view2d"><div class='floor-container'><h2>Floor 1 - (3 rooms)</h2><svg width='460' height='1090' style='border: 2px solid #bdc3c7; background: #fff;'><rect x='20' y='20' width='205' height='210' class='room living' /><line x1='112.5' y1='230' x2='132.5' y2='230' stroke='#fff' stroke-width='4' /><path d='M 112.5 230 A 20 20 0 0 1 132.5 210' class='door' /><line x1='107.5' y1='20' x2='137.5' y2='20' class='window' /><text x='122.5' y='117' class='label'>LIVING</text><text x='122.5' y='133' class='dim'>5.85x6m</text><rect x='228' y='20' width='123' height='140' class='room kitchen' /><line x1='279.5' y1='160' x2='299.5' y2='160' stroke='#fff' stroke-width='4' /><path d='M 279.5 160 A 20 20 0 0 1 299.5 140' class='door' /><line x1='274.5' y1='20' x2='304.5' y2='20' class='window' /><text x='289.5' y='82' class='label'>KITCHEN</text><text x='289.5' y='98' class='dim'>3.51x4m</text><rect x='355' y='20' width='82' height='88' class='room bathroom' /><line x1='386' y1='108' x2='406' y2='108' stroke='#fff' stroke-width='4' /><path d='M 386 108 A 20 20 0 0 1 406 88' class='door' /><line x1='381' y1='20' x2='411' y2='20' class='window' /><text x='396' y='56' class='label'>BATHROOM</text><text x='396' y='72' class='dim'>2.34x2.5m</text><rect x='20' y='20' width='420' height='1050' fill='none' stroke='#e74c3c' stroke-width='3' stroke-dasharray='5,5' /></svg></div><div class='floor-container'><h2>Floor 2 - (1 rooms)</h2><svg width='460' height='1090' style='border: 2px solid #bdc3c7; background: #fff;'><rect x='20' y='20' width='416' height='158' class='room bedroom' /><line x1='218' y1='178' x2='238' y2='178' stroke='#fff' stroke-width='4' /><path d='M 218 178 A 20 20 0 0 1 238 158' class='door' /><line x1='213' y1='20' x2='243' y2='20' class='window' /><text x='228' y='91' class='label'>BEDROOM</text><text x='228' y='107' class='dim'>11.9x4.5m</text><rect x='20' y='20' width='420' height='1050' fill='none' stroke='#e74c3c' stroke-width='3' stroke-dasharray='5,5' /></svg></div></div><div id='view3d-container'></div>    <script>
        let is3D = false;
        const roomsData = [{"id":"r1","normalizedType":"living","label":"Living Room","lengthM":6,"areaM2":30,"floor":1,"x":0,"y":0,"x2":5.85,"y2":6,"widthM":5.85},{"id":"r3","normalizedType":"kitchen","label":"Kitchen","lengthM":4,"areaM2":12,"floor":1,"x":5.9499999999999993,"y":0,"x2":9.4599999999999991,"y2":4,"widthM":3.51},{"id":"r4","normalizedType":"bathroom","label":"Bathroom","lengthM":2.5,"areaM2":5,"floor":1,"x":9.5599999999999987,"y":0,"x2":11.899999999999999,"y2":2.5,"widthM":2.34}];
        
        function toggle3D() {
            is3D = !is3D;
            document.getElementById('view2d').style.display = is3D ? 'none' : 'block';
            document.getElementById('view3d-container').style.display = is3D ? 'block' : 'none';
            if (is3D && !window.sceneInitialized) { init3D(); window.sceneInitialized = true; }
        }

        function init3D() {
            const container = document.getElementById('view3d-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(15, 20, 30);
            camera.lookAt(6, 0, 15);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const wallHeight = 3.0;
            const colors = {
                'living': 0xa8e6cf, 'bedroom': 0xdcedc1, 'kitchen': 0xffd3b6,
                'bathroom': 0xffaaa5, 'default': 0xf8f9fa
            };

            roomsData.forEach(room => {
                const w = room.widthM;
                const l = room.lengthM;
                const x = room.x + w/2;
                const z = room.y + l/2;
                
                const geo = new THREE.BoxGeometry(w, wallHeight, l);
                const color = colors[room.normalizedType] || colors['default'];
                const mat = new THREE.MeshPhongMaterial({ color: color, transparent: true, opacity: 0.8 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, wallHeight/2, z);
                scene.add(mesh);
                
                const edges = new THREE.EdgesGeometry(geo);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x333333 }));
                line.position.copy(mesh.position);
                scene.add(line);
            });

            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
